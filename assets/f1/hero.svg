<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Glen Devit Renaldi — machine learning and full-stack engineering, Formula 1 telemetry style</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080A"/>
      <stop offset="0.55" stop-color="#101014"/>
      <stop offset="1" stop-color="#170607"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2800" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF2800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rosso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3B1C"/>
      <stop offset="1" stop-color="#B80E00"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2800" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF2800" stop-opacity="0.35"/>
      <stop offset="0.8" stop-color="#FF2800" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF2800" stop-opacity="0"/>
    </linearGradient>
    <pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V10" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F7F7F8"/>
      <rect x="20" y="20" width="20" height="20" fill="#F7F7F8"/>
      <rect x="20" width="20" height="20" fill="#0A0A0C"/>
      <rect y="20" width="20" height="20" fill="#0A0A0C"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="470" fill="url(#bg)"/>
  <rect width="1200" height="470" fill="url(#carbon)"/>
  <ellipse cx="880" cy="390" rx="420" ry="150" fill="url(#glow)"/>
  <ellipse cx="140" cy="40" rx="260" ry="120" fill="#FF2800" opacity="0.05" filter="url(#soft)"/>

  <path d="M0 14H1200" stroke="#FF2800" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M0 18H1200" stroke="#FF2800" stroke-opacity="0.15" stroke-width="1"/>

  <g class="mono">
    <text x="72" y="56" fill="#FFD700" font-size="12" letter-spacing="5">SCUDERIA GLEN</text>
    <text x="1128" y="56" fill="#6B7075" font-size="11" text-anchor="end" letter-spacing="2">SEASON 2026</text>
  </g>

  <g class="sans" font-style="italic" font-weight="900">
    <text x="68" y="162" fill="#F7F7F8" font-size="76" letter-spacing="-1">GLEN DEVIT</text>
    <text x="68" y="240" fill="url(#rosso)" font-size="76" letter-spacing="-1">RENALDI</text>
  </g>

  <!-- italian tricolore -->
  <g>
    <rect x="72" y="258" width="26" height="4" fill="#008C45"/>
    <rect x="98" y="258" width="26" height="4" fill="#F4F5F0"/>
    <rect x="124" y="258" width="26" height="4" fill="#CD212A"/>
  </g>

  <g class="mono">
    <text x="72" y="286" fill="#A7ABB0" font-size="13" letter-spacing="2">MACHINE LEARNING · FULL-STACK ENGINEERING</text>
    <rect x="72" y="300" width="150" height="26" rx="13" fill="#FF2800" fill-opacity="0.12" stroke="#FF2800" stroke-opacity="0.5"/>
    <circle cx="88" cy="313" r="4" fill="#00D2BE">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="317" fill="#FF6A4D" font-size="10" letter-spacing="1.5">OPEN TO ROLES</text>
    <text x="238" y="317" fill="#5F6469" font-size="11" letter-spacing="1">PALANGKA RAYA · ID</text>
  </g>

  <!-- start lights -->
  <g>
    <rect x="856" y="82" width="252" height="60" rx="10" fill="#0C0C0E" stroke="#2A2A2E"/>
    <g fill="#1E1E22" stroke="#34343A">
      <circle cx="886" cy="112" r="14"/>
      <circle cx="930" cy="112" r="14"/>
      <circle cx="974" cy="112" r="14"/>
      <circle cx="1018" cy="112" r="14"/>
      <circle cx="1062" cy="112" r="14"/>
    </g>
    <g fill="#FF2800">
      <circle cx="886" cy="112" r="10" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="112" r="10" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="0.55s" repeatCount="indefinite"/>
      </circle>
      <circle cx="974" cy="112" r="10" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1018" cy="112" r="10" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="1.65s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1062" cy="112" r="10" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="974" cy="112" r="26" fill="#00D2BE" opacity="0">
      <animate attributeName="opacity" values="0;0;0.35;0" keyTimes="0;0.47;0.5;0.58" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="mono">
    <text x="856" y="192" fill="#5F6469" font-size="10" letter-spacing="2">SPEED TRAP</text>
    <text x="856" y="238" fill="#F7F7F8" font-size="44" font-weight="700" letter-spacing="-1">327</text>
    <text x="948" y="238" fill="#FF2800" font-size="13" letter-spacing="1">KM/H</text>
    <g font-size="11" fill="#5F6469">
      <text x="856" y="264">GEAR</text>
      <text x="905" y="264" fill="#FFD700">7</text>
      <text x="952" y="264">DRS</text>
      <text x="992" y="264" fill="#00D2BE">OPEN</text>
    </g>
    <rect x="856" y="276" width="252" height="3" fill="#1C1C20"/>
    <rect x="856" y="276" width="196" height="3" fill="#FF2800">
      <animate attributeName="width" values="120;252;252;120" keyTimes="0;0.35;0.7;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- track -->
  <rect x="0" y="340" width="1200" height="100" fill="#0A0A0C" opacity="0.55"/>
  <path d="M0 438H1200" stroke="#2A2A2E" stroke-width="2"/>
  <rect x="0" y="436" width="1200" height="2" fill="url(#lane)"/>

  <!-- car -->
  <g transform="translate(0,340)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-640,0;1560,0;1560,0" keyTimes="0;0.26;1" dur="9s" repeatCount="indefinite"/>
      <ellipse cx="290" cy="100" rx="240" ry="9" fill="#FF2800" opacity="0.16"/>
      <g opacity="0.55" stroke="#FF2800" stroke-width="2" stroke-linecap="round">
        <line x1="30" y1="40" x2="-140" y2="40">
          <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="30" y1="58" x2="-200" y2="58">
          <animate attributeName="opacity" values="0;0.5;0" dur="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="30" y1="76" x2="-110" y2="76">
          <animate attributeName="opacity" values="0;0.6;0" dur="0.45s" repeatCount="indefinite"/>
        </line>
      </g>

      <g transform="translate(24,0) scale(0.85)">
        <!-- rear wing -->
        <rect x="10" y="2" width="92" height="8" rx="2" fill="#151518" stroke="#33333A"/>
        <rect x="6" y="0" width="7" height="30" rx="2" fill="#FF2800"/>
        <rect x="99" y="0" width="7" height="30" rx="2" fill="#FF2800"/>
        <rect x="14" y="12" width="84" height="3" fill="#26262C">
          <animateTransform attributeName="transform" type="rotate"
            values="0 100 14; -14 100 14; 0 100 14" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <path d="M50 10 L54 52 L64 52 L60 10 Z" fill="#151518"/>

        <!-- body -->
        <path d="M30 62
                 C70 48 140 44 200 46
                 L240 36
                 C272 28 312 30 342 40
                 L420 54
                 L506 66
                 L528 72
                 L528 78
                 L430 80
                 L340 82
                 L240 84
                 L140 82
                 L60 76 Z"
              fill="url(#rosso)"/>
        <path d="M34 60 C80 50 150 46 210 50 L330 58" fill="none" stroke="#FF7A5E" stroke-opacity="0.4" stroke-width="2"/>
        <path d="M200 46 L240 36 C272 28 312 30 342 40" fill="none" stroke="#7A0A00" stroke-width="2" opacity="0.55"/>

        <!-- sidepod -->
        <path d="M140 58 C200 52 280 52 330 58 L338 78 L150 80 Z" fill="#B80E00" opacity="0.5"/>

        <!-- airbox, cockpit, halo -->
        <path d="M228 38 L242 18 L262 18 L252 40 Z" fill="#8E0B00"/>
        <ellipse cx="276" cy="41" rx="22" ry="6" fill="#0A0A0C"/>
        <path d="M246 40 C250 20 296 18 306 38" fill="none" stroke="#151518" stroke-width="6" stroke-linecap="round"/>
        <path d="M248 38 C253 24 293 22 303 37" fill="none" stroke="#FFD700" stroke-opacity="0.25" stroke-width="1.4"/>

        <!-- nose -->
        <path d="M360 56 L500 68" stroke="#FFD700" stroke-opacity="0.3" stroke-width="3"/>

        <!-- front wing -->
        <rect x="500" y="80" width="42" height="6" rx="2" fill="#151518" stroke="#33333A"/>
        <rect x="500" y="74" width="5" height="16" rx="1" fill="#FF2800"/>
        <rect x="537" y="74" width="5" height="16" rx="1" fill="#FF2800"/>

        <!-- floor -->
        <path d="M60 78 L200 84 L320 84 L400 80" stroke="#0C0C0E" stroke-width="6" fill="none"/>

        <!-- wheels -->
        <g>
          <circle cx="130" cy="86" r="28" fill="#0C0C0E" stroke="#2A2A30" stroke-width="3"/>
          <circle cx="130" cy="86" r="12" fill="#1A1A1F" stroke="#3A3A42" stroke-width="2"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 130 86" to="360 130 86" dur="1.1s" repeatCount="indefinite"/>
            <path d="M130 75 L130 97 M119 86 L141 86" stroke="#4A4A52" stroke-width="2"/>
          </g>
        </g>
        <g>
          <circle cx="420" cy="88" r="26" fill="#0C0C0E" stroke="#2A2A30" stroke-width="3"/>
          <circle cx="420" cy="88" r="11" fill="#1A1A1F" stroke="#3A3A42" stroke-width="2"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 420 88" to="360 420 88" dur="1.1s" repeatCount="indefinite"/>
            <path d="M420 78 L420 98 M410 88 L430 88" stroke="#4A4A52" stroke-width="2"/>
          </g>
        </g>

        <text x="300" y="72" class="sans" font-size="15" font-weight="700" fill="#FFD700" opacity="0.9">GR</text>
      </g>
    </g>
  </g>

  <!-- checkered strip -->
  <g>
    <rect x="-40" y="446" width="1240" height="24" fill="url(#checker)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
