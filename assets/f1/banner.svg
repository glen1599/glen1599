<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Scuderia Glen — a racing circuit with a car doing a flying lap</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070709"/>
      <stop offset="0.6" stop-color="#0E0E12"/>
      <stop offset="1" stop-color="#180607"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2800" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF2800" stop-opacity="0"/>
    </radialGradient>
    <pattern id="carbon2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V10" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>
    </pattern>
    <pattern id="checker2" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F7F7F8"/>
      <rect x="16" y="16" width="16" height="16" fill="#F7F7F8"/>
      <rect x="16" width="16" height="16" fill="#0A0A0C"/>
      <rect y="16" width="16" height="16" fill="#0A0A0C"/>
    </pattern>
    <linearGradient id="trackline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2800"/>
      <stop offset="1" stop-color="#FF7A5E"/>
    </linearGradient>
  </defs>

  <style>
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans2 { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg2)"/>
  <rect width="1200" height="300" fill="url(#carbon2)"/>
  <ellipse cx="900" cy="280" rx="360" ry="120" fill="url(#glow2)"/>

  <!-- circuit -->
  <path id="track" d="M150 246
    C 88 246 62 196 96 166
    C 128 138 186 148 214 118
    C 242 88 232 56 282 50
    C 340 43 362 84 402 94
    C 452 106 502 82 532 112
    C 562 142 542 200 502 220
    C 452 246 402 212 352 206
    C 302 200 252 226 212 246
    C 190 257 168 248 150 246 Z"
    fill="none" stroke="#1C1C22" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 246
    C 88 246 62 196 96 166
    C 128 138 186 148 214 118
    C 242 88 232 56 282 50
    C 340 43 362 84 402 94
    C 452 106 502 82 532 112
    C 562 142 542 200 502 220
    C 452 246 402 212 352 206
    C 302 200 252 226 212 246
    C 190 257 168 248 150 246 Z"
    fill="none" stroke="url(#trackline)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M150 246
    C 88 246 62 196 96 166
    C 128 138 186 148 214 118
    C 242 88 232 56 282 50
    C 340 43 362 84 402 94
    C 452 106 502 82 532 112
    C 562 142 542 200 502 220
    C 452 246 402 212 352 206
    C 302 200 252 226 212 246
    C 190 257 168 248 150 246 Z"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- car dot doing a flying lap -->
  <g>
    <circle r="10" fill="#FFD700" opacity="0.18">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#track"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="#FFD700">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#track"/>
      </animateMotion>
    </circle>
    <circle r="2" fill="#FFFFFF">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#track"/>
      </animateMotion>
    </circle>
  </g>

  <!-- sector markers -->
  <g class="mono2" fill="#4A4E52" font-size="8" letter-spacing="1">
    <text x="86" y="278">S1</text>
    <text x="520" y="66">S2</text>
    <text x="520" y="248">S3</text>
  </g>

  <!-- right block -->
  <g class="sans2" font-style="italic" font-weight="900">
    <text x="664" y="108" fill="#F7F7F8" font-size="38" letter-spacing="-0.5">SCUDERIA GLEN</text>
  </g>
  <g class="mono2">
    <text x="666" y="138" fill="#FF2800" font-size="11" letter-spacing="3">MACHINE LEARNING · FULL-STACK ENGINEERING</text>
    <text x="666" y="176" fill="#5F6469" font-size="9" letter-spacing="2">LIGHTS OUT</text>

    <g fill="#1E1E22" stroke="#34343A">
      <circle cx="682" cy="200" r="9"/>
      <circle cx="708" cy="200" r="9"/>
      <circle cx="734" cy="200" r="9"/>
      <circle cx="760" cy="200" r="9"/>
      <circle cx="786" cy="200" r="9"/>
    </g>
    <g fill="#FF2800">
      <circle cx="682" cy="200" r="6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="708" cy="200" r="6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="734" cy="200" r="6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="200" r="6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="786" cy="200" r="6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.08;0.4;0.46;1" dur="9s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="666" y="236" fill="#5F6469" font-size="9" letter-spacing="2">327 KM/H · GEAR 7 · DRS OPEN</text>
  </g>

  <!-- speed lines -->
  <g stroke="#FF2800" stroke-linecap="round" opacity="0.35">
    <line x1="666" y1="252" x2="806" y2="252" stroke-width="2">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="826" y1="252" x2="906" y2="252" stroke-width="2">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- checkered base -->
  <g>
    <rect x="-32" y="282" width="1264" height="18" fill="url(#checker2)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-32 0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
