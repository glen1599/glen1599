<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Glen Devit Renaldi — machine learning and full-stack engineering, always learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05121B"/>
      <stop offset="0.55" stop-color="#0A1B2A"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E9FFFB"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="338" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="140" cy="20" r="360" fill="url(#tealGlow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="330" r="340" fill="url(#violetGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#1E3F4C" fill="none">
      <circle cx="975" cy="150" r="108" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="975" cy="150" r="146" stroke-dasharray="2 14" stroke-opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360 975 150" to="0 975 150" dur="38s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <circle cx="975" cy="42" r="5" fill="#5EEAD4">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1121" cy="150" r="4" fill="#7DD3FC">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="-360 975 150" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="975" cy="258" r="3.5" fill="#C4B5FD">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="21s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="975" cy="150" r="66" fill="#07141F" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="975" cy="150" r="66" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="90 320">
      <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="975" y="161" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="30" font-weight="700" fill="#E9FFFB">GD</text>

    <text x="64" y="92" font-family="Menlo, 'SF Mono', monospace" font-size="12" letter-spacing="4.5" fill="#5EEAD4">ALWAYS LEARNING · BUILDING IN PUBLIC</text>
    <text x="64" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#nameFill)">Glen Devit Renaldi</text>
    <text x="64" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#A6BACB">Models that ship. Interfaces that hold up. Still learning.</text>

    <rect x="64" y="228" width="4" height="16" rx="2" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Menlo, 'SF Mono', monospace" font-size="14">
      <text x="80" y="242" fill="#8FD9CC" opacity="1">
        $ python train.py --model yolov8
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.27;0.30;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="242" fill="#8FD9CC" opacity="0">
        $ npm run build &amp;&amp; supabase db push
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.63;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="242" fill="#8FD9CC" opacity="0">
        $ swift build -c release
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.94;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="64" y="286" width="470" height="3" rx="1.5" fill="#1B3341"/>
    <rect x="64" y="286" width="470" height="3" rx="1.5" fill="url(#accent)" opacity="0.9">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="26" fill="none" stroke="#1E3F4C" stroke-width="1.5"/>
  </g>
</svg>
