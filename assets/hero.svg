<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Glen Devit Renaldi — Machine Learning and Full-Stack Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151C2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.50"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="338" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="975" cy="150" r="260" fill="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- orbital system -->
    <g stroke="#2B4468" fill="none">
      <circle cx="975" cy="150" r="108" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="975" cy="150" r="146" stroke-dasharray="2 14" stroke-opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360 975 150" to="0 975 150" dur="38s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <circle cx="975" cy="42" r="5" fill="#22D3EE">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1121" cy="150" r="4" fill="#60A5FA">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="-360 975 150" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="975" cy="258" r="3.5" fill="#93C5FD">
        <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="21s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="975" cy="150" r="66" fill="#0F1726" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="975" cy="150" r="66" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="90 320">
      <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="975" y="161" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="30" font-weight="700" fill="#E8EFFF">GD</text>

    <!-- copy -->
    <text x="64" y="92" font-family="Menlo, 'SF Mono', monospace" font-size="12" letter-spacing="4.5" fill="#7DA2CE">MACHINE LEARNING · FULL-STACK</text>
    <text x="64" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F4F7FC">Glen Devit Renaldi</text>
    <text x="64" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0C7">Models that ship. Interfaces that hold up. Tests that prove it.</text>

    <rect x="64" y="228" width="4" height="16" rx="2" fill="#60A5FA">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Menlo, 'SF Mono', monospace" font-size="14">
      <text x="80" y="242" fill="#8FB4E8" opacity="1">
        $ python train.py --model yolov8
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.27;0.30;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="242" fill="#8FB4E8" opacity="0">
        $ npm run build &amp;&amp; supabase db push
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.60;0.63;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="242" fill="#8FB4E8" opacity="0">
        $ swift build -c release
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.94;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="64" y="286" width="470" height="3" rx="1.5" fill="#22304A"/>
    <rect x="64" y="286" width="470" height="3" rx="1.5" fill="url(#accent)" opacity="0.9">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="26" fill="none" stroke="#22304A" stroke-width="1.5"/>
  </g>
</svg>
